[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-lab"
version = "0.4.2"
description = "Reproducible low-speed particle-motion research toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "TrajectoryLab contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pint>=0.24,<1",
  "pydantic>=2.7,<3",
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "PyOpenGL>=3.1.7,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
]
build = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
trajectory-lab = "trajectory_lab.cli:main"

[tool.setuptools.packages.find]
include = ["trajectory_lab*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["trajectory_lab/core"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.setuptools.package-data]
trajectory_lab = [
  "ui/i18n/*.json",
  "ui/resources/themes/*.qss",
  "ui/resources/*.png",
  "ui/resources/*.ico",
  "ui/resources/branding/*.svg",
  "ui/resources/manuals/*.pdf",
]
"trajectory_lab.examples" = ["*.json"]
